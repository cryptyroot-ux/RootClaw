# One RootClaw tenant: the harness server plus Caddy for TLS + login.
#
# Caddy runs in the server's network namespace, so it reaches the server on
# 127.0.0.1 — the server never binds a public interface. Ports are therefore
# declared on the `rootclaw` service (the namespace owner).
#
#   cp .env.example .env   # set DOMAIN
#   docker compose up -d --build   # builds the image locally from this checkout
services:
  rootclaw:
    build:
      context: ..
      args:
        ENGINES: ${ENGINES:-}
    # local tag for the image built above; no prebuilt image is published (docker.yml has push: false)
    image: ghcr.io/cryptyroot-ux/rootclaw:latest
    restart: unless-stopped
    # The bots' browsers (docs/browser-packaging.md, "Process hygiene"): an
    # init collects the browser processes whose parents exit, and Chrome
    # gets the shared memory ROOTCLAW's desktop containers give it.
    init: true
    shm_size: 512m
    volumes:
      - data:/data
    ports:
      - "80:80"
      - "443:443"
    environment:
      ROOTCLAW_PORT: "8799"
      ROOTCLAW_WEBHOOK_PORT: "8800"
      # what the app prints as hook URLs — Caddy passes /hooks/* straight through
      ROOTCLAW_WEBHOOK_PUBLIC_URL: https://${DOMAIN}
      # pairing links for remote clients point here (docs/self-hosting.md)
      ROOTCLAW_PUBLIC_URL: https://${DOMAIN}
      # Who may sign in with an emailed code at /pair (docs/self-hosting.md,
      # "Sign in with your email"). Empty means pairing codes only.
      ROOTCLAW_SIGNIN_EMAILS: ${ROOTCLAW_SIGNIN_EMAILS:-}
      ROOTCLAW_SIGNIN_MEMBER_EMAILS: ${ROOTCLAW_SIGNIN_MEMBER_EMAILS:-}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8799/api/health | grep -q rootclaw"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2
    restart: unless-stopped
    network_mode: "service:rootclaw"
    depends_on:
      rootclaw:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  data:
  caddy_data:
  caddy_config:
