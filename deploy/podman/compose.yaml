name: ${COMPOSE_PROJECT_NAME:-rootclaw-podman}
services:
  rootclaw:
    build:
      context: ../..
      dockerfile: deploy/podman/Containerfile
      args:
        ENGINES: ${ENGINES:-}
    image: localhost/rootclaw-podman:${ROOTCLAW_IMAGE_TAG:-local}
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    userns_mode: keep-id:uid=1001,gid=1001
    user: "1001:1001"
    restart: unless-stopped
    # On Windows this is the Linux Podman machine. The app must reach the
    # dynamically allocated, loopback-only desktop ports on that same host.
    network_mode: host
    volumes:
      - ${ROOTCLAW_DATA_ROOT:?Run setup.sh first}:${ROOTCLAW_DATA_ROOT}
      - ${PODMAN_SOCKET:?Run setup.sh first}:/run/rootclaw-podman.sock
    environment:
      HOME: ${ROOTCLAW_DATA_ROOT}
      ROOTCLAW_DATA_DIR: ${ROOTCLAW_DATA_ROOT}/.rootclaw
      ROOTCLAW_STATIC_DIR: /app/dist
      CONTAINER_HOST: unix:///run/rootclaw-podman.sock
      ROOTCLAW_PORT: ${ROOTCLAW_PORT:-8799}
      ROOTCLAW_WEBHOOK_PORT: ${ROOTCLAW_WEBHOOK_PORT:-8800}
      ROOTCLAW_PUBLIC_URL: ${ROOTCLAW_PUBLIC_URL:-http://localhost:8080}
      ROOTCLAW_WEBHOOK_PUBLIC_URL: ${ROOTCLAW_PUBLIC_URL:-http://localhost:8080}
    healthcheck:
      test: [CMD-SHELL, 'curl -fsS http://127.0.0.1:$$ROOTCLAW_PORT/api/health | grep -q rootclaw']
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: docker.io/library/caddy:2.11.4
    restart: unless-stopped
    network_mode: host
    depends_on:
      rootclaw:
        condition: service_healthy
    environment:
      ROOTCLAW_HTTP_PORT: ${ROOTCLAW_HTTP_PORT:-8080}
      ROOTCLAW_PORT: ${ROOTCLAW_PORT:-8799}
      ROOTCLAW_WEBHOOK_PORT: ${ROOTCLAW_WEBHOOK_PORT:-8800}
      ROOTCLAW_HTTPS_HOST: ${ROOTCLAW_HTTPS_HOST:-https-disabled.invalid}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
