name: VPS server image release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: vps-image-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify tag, package, and Compose versions
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const packageVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
            const compose = readFileSync("deploy/docker-compose.yml", "utf8");
            const image = /^\s*image:\s*ghcr\.io\/cryptyroot-ux\/rootclaw:\$\{ROOTCLAW_IMAGE_TAG:-v([^}]+)\}\s*$/m.exec(compose)?.[1];
            if (process.env.GITHUB_REF_NAME !== `v${packageVersion}`) throw new Error(`Tag ${process.env.GITHUB_REF_NAME} does not match package version ${packageVersion}`);
            if (image !== packageVersion) throw new Error(`Compose image version ${image ?? "<missing>"} does not match package version ${packageVersion}`);
          '
      - name: Run server release tests
        run: pnpm exec vitest run scripts/docker-image.test.ts server/read-and-draft.test.ts server/proactive-routines.e2e.test.ts
      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - run: pnpm lint

  smoke:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            tag: rootclaw:smoke-amd64
          - platform: linux/arm64
            arch: arm64
            tag: rootclaw:smoke-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: ${{ matrix.platform }}
          tags: ${{ matrix.tag }}
          load: true
          cache-from: type=gha,scope=vps-server-${{ matrix.arch }}
          cache-to: type=gha,scope=vps-server-${{ matrix.arch }},mode=max
      - name: Run image and verify its healthcheck
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          chmod 0777 "$data_dir"
          trap 'docker logs rootclaw-image-smoke 2>&1 || true; docker rm -f rootclaw-image-smoke >/dev/null 2>&1 || true; rm -rf "$data_dir"' EXIT
          docker run --detach --name rootclaw-image-smoke \
            --mount "type=bind,source=$data_dir,target=/data" \
            "${{ matrix.tag }}"
          for attempt in $(seq 1 90); do
            health="$(docker inspect --format '{{.State.Health.Status}}' rootclaw-image-smoke)"
            if [ "$health" = healthy ]; then
              docker exec rootclaw-image-smoke curl --fail --silent --show-error http://127.0.0.1:8799/api/health
              docker exec rootclaw-image-smoke node --input-type=module -e '
                import { createRequire } from "node:module";
                const require = createRequire("/app/duckdb/node_modules/rootclaw-duckdb-anchor.js");
                const { DuckDBInstance } = require("@duckdb/node-api");
                const instance = await DuckDBInstance.create(":memory:");
                const connection = await instance.connect();
                await connection.run("SELECT 1");
                connection.closeSync();
                instance.closeSync();
              '
              exit 0
            fi
            if [ "$health" = unhealthy ]; then
              echo "${{ matrix.platform }} server image became unhealthy" >&2
              exit 1
            fi
            sleep 2
          done
          echo "${{ matrix.platform }} server image did not become healthy" >&2
          exit 1

  publish:
    needs:
      - checks
      - smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/cryptyroot-ux/rootclaw:${{ github.ref_name }}
          cache-from: |
            type=gha,scope=vps-server-amd64
            type=gha,scope=vps-server-arm64
          cache-to: type=gha,scope=vps-server-publish,mode=max
