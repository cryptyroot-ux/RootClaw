name: Images

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build --target server -t rootclaw-server:ci .
      - name: Assert the built server image contract
        run: |
          test "$(docker image inspect rootclaw-server:ci --format '{{.Config.User}}')" = "rootclaw"
          docker run --rm --entrypoint bwrap rootclaw-server:ci --version
          docker run -d --name rootclaw-image-check rootclaw-server:ci
          trap 'docker rm -f rootclaw-image-check >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec rootclaw-image-check curl --fail --silent http://127.0.0.1:8799/api/health >/dev/null; then exit 0; fi
            sleep 2
          done
          docker logs rootclaw-image-check
          exit 1

  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: keys
        run: |
          chrome=""
          if json=$(curl -fsSL "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"); then
            chrome=$(printf '%s\n' "$json" | jq -r '.channels.Stable.version // empty')
          fi
          if [ -z "$chrome" ]; then chrome="date-$(date -u +%F)"; fi
          {
            printf 'chrome=%s\n' "$chrome"
          } >> "$GITHUB_OUTPUT"
      - id: server
        uses: docker/build-push-action@v6
        with:
          target: server
          push: false
          build-args: |
            CHROME_CACHE_TAG=${{ steps.keys.outputs.chrome }}
          cache-from: type=gha
          cache-to: type=gha,scope=server,mode=max
      - id: home
        uses: docker/build-push-action@v6
        with:
          target: cloud-home
          push: false
          build-args: |
            CHROME_CACHE_TAG=${{ steps.keys.outputs.chrome }}
          cache-from: |
            type=gha
            type=gha,scope=cloud-home
          cache-to: type=gha,scope=cloud-home,mode=max
