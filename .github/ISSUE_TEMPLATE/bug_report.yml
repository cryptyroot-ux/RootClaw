name: Bug report
description: Something is broken
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Before filing
      options:
        - label: I searched existing issues and this isn't a duplicate
          required: true
  - type: dropdown
    attributes:
      label: Area
      options:
        - Chat UI (src/)
        - Harness server / API (server/)
        - Native engine / provider drivers (Anthropic, OpenAI, OpenRouter, Ollama, …)
        - Computer use (cloud box / local)
        - Connected apps (Composio)
        - Desktop shell / packaging (electron/)
        - Docs
        - Not sure
    validations:
      required: true
  - type: textarea
    attributes:
      label: What happened
      description: What did you do, what did you expect, what happened instead?
      placeholder: |
        1. Opened the Computer panel on a fresh bot
        2. Expected the box to provision
        3. Got a spinner forever; the server log says …
    validations:
      required: true
  - type: input
    attributes:
      label: Version and install
      description: RootClaw version or commit, how you run it (source build, Docker, desktop build) and your OS
      placeholder: 0.1.135 (b2d2849) · source build · Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    attributes:
      label: Logs
      description: >-
        Anything from the terminal running `pnpm dev:server`, or the per-thread
        event logs in `~/.rootclaw/events/`. Redact anything that looks like
        a key or token before pasting.
      render: text
