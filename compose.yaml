name: ${COMPOSE_PROJECT_NAME:-rootclaw}
services:
  rootclaw:
    # Collects exited browser processes; Chrome's shared memory as on the
    # desktop containers (docs/browser-packaging.md, "Process hygiene").
    init: true
    shm_size: 512m
    build:
      context: ./deploy/local
      args:
        BASE_IMAGE: ${ROOTCLAW_BASE_IMAGE:-ghcr.io/cryptyroot-ux/rootclaw:latest}
        ENGINES: ${ENGINES:-}
    image: ${ROOTCLAW_LOCAL_IMAGE:-rootclaw-local:latest}
    restart: unless-stopped
    volumes:
      - data:/data
    ports:
      - "${ROOTCLAW_BIND_ADDRESS:-127.0.0.1}:${ROOTCLAW_HTTP_PORT:-8080}:80"
    environment:
      ROOTCLAW_PORT: "8799"
      ROOTCLAW_WEBHOOK_PORT: "8800"
      ROOTCLAW_PUBLIC_URL: ${ROOTCLAW_PUBLIC_URL:-http://localhost:${ROOTCLAW_HTTP_PORT:-8080}}
      ROOTCLAW_WEBHOOK_PUBLIC_URL: ${ROOTCLAW_WEBHOOK_PUBLIC_URL:-${ROOTCLAW_PUBLIC_URL:-http://localhost:${ROOTCLAW_HTTP_PORT:-8080}}}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8799/api/health', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('rootclaw')) process.exit(1); }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
  caddy:
    image: ${CADDY_IMAGE:-caddy:2}
    restart: unless-stopped
    network_mode: service:rootclaw
    environment:
      ROOTCLAW_HTTPS_HOST: ${ROOTCLAW_HTTPS_HOST:-}
      ROOTCLAW_BIND_ADDRESS: ${ROOTCLAW_BIND_ADDRESS:-127.0.0.1}
    command:
      - /bin/sh
      - -ec
      - |
        export ROOTCLAW_UPSTREAM_SCHEME=http
        if [ -n "$$ROOTCLAW_HTTPS_HOST" ] && [ "$$ROOTCLAW_BIND_ADDRESS" != "127.0.0.1" ]; then
          echo "ROOTCLAW_HTTPS_HOST requires ROOTCLAW_BIND_ADDRESS=127.0.0.1; forward HTTPS through a trusted local proxy." >&2
          exit 1
        fi
        if [ -n "$$ROOTCLAW_HTTPS_HOST" ]; then
          export ROOTCLAW_UPSTREAM_SCHEME=https
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    depends_on:
      rootclaw:
        condition: service_healthy
    volumes:
      - ./deploy/local/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  data:
    external: ${ROOTCLAW_DATA_EXTERNAL:-false}
    name: ${ROOTCLAW_DATA_VOLUME:-${COMPOSE_PROJECT_NAME:-rootclaw}_data}
  caddy_data:
  caddy_config:
